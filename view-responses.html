<!DOCTYPE html>
<html lang="cs">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zobrazit Odpovědi - DaněNula.cz</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 2rem;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 3rem;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        h1 {
            color: #667eea;
            margin-bottom: 2rem;
            font-size: 2.5rem;
        }

        .stats {
            display: flex;
            gap: 2rem;
            margin-bottom: 2rem;
        }

        .stat-card {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            padding: 1.5rem;
            border-radius: 12px;
            flex: 1;
        }

        .stat-card h3 {
            font-size: 0.9rem;
            opacity: 0.9;
            margin-bottom: 0.5rem;
        }

        .stat-card p {
            font-size: 2rem;
            font-weight: bold;
        }

        .submissions {
            margin-top: 2rem;
        }

        .submission-card {
            background: #f8f9fa;
            border: 2px solid #e9ecef;
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            transition: all 0.3s ease;
        }

        .submission-card:hover {
            border-color: #667eea;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.2);
        }

        .submission-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
            padding-bottom: 1rem;
            border-bottom: 2px solid #e9ecef;
        }

        .submission-id {
            font-weight: bold;
            color: #667eea;
        }

        .submission-time {
            color: #6c757d;
            font-size: 0.9rem;
        }

        .submission-data {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 1rem;
        }

        .data-field {
            background: white;
            padding: 1rem;
            border-radius: 8px;
            border-left: 3px solid #667eea;
        }

        .data-field label {
            display: block;
            font-weight: 600;
            color: #495057;
            margin-bottom: 0.5rem;
            font-size: 0.85rem;
            text-transform: uppercase;
        }

        .data-field value {
            display: block;
            color: #212529;
            font-size: 1rem;
        }

        .array-value {
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
        }

        .array-item {
            padding: 0.25rem 0.5rem;
            background: #e7f1ff;
            border-radius: 4px;
            font-size: 0.9rem;
        }

        .loading {
            text-align: center;
            padding: 3rem;
            color: #6c757d;
        }

        .error {
            background: #f8d7da;
            color: #721c24;
            padding: 1rem;
            border-radius: 8px;
            border: 1px solid #f5c6cb;
        }

        .export-btn {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            padding: 1rem 2rem;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 2rem;
        }

        .export-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>📊 Přijaté Odpovědi</h1>

        <div class="stats">
            <div class="stat-card">
                <h3>Celkem odpovědí</h3>
                <p id="total-count">0</p>
            </div>
            <div class="stat-card">
                <h3>Poslední odpověď</h3>
                <p id="last-submission">-</p>
            </div>
        </div>

        <button class="export-btn" onclick="exportToCSV()">📥 Exportovat do CSV</button>

        <div id="submissions-container" class="submissions">
            <div class="loading">Načítání odpovědí...</div>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:3001/api/submissions';

        async function loadSubmissions() {
            try {
                const response = await fetch(API_URL);
                const result = await response.json();

                if (result.success) {
                    displaySubmissions(result.submissions);
                } else {
                    showError('Chyba při načítání odpovědí');
                }
            } catch (error) {
                console.error('Error loading submissions:', error);
                showError('Nelze se připojit k API serveru. Ujistěte se, že běží (npm run api).');
            }
        }

        function displaySubmissions(submissions) {
            const container = document.getElementById('submissions-container');
            const totalCount = document.getElementById('total-count');
            const lastSubmission = document.getElementById('last-submission');

            if (submissions.length === 0) {
                container.innerHTML = '<div class="loading">Zatím žádné odpovědi</div>';
                return;
            }

            totalCount.textContent = submissions.length;

            const latest = submissions[submissions.length - 1];
            const latestDate = new Date(latest.timestamp);
            lastSubmission.textContent = latestDate.toLocaleString('cs-CZ');

            container.innerHTML = submissions
                .reverse()
                .map(submission => createSubmissionCard(submission))
                .join('');
        }

        function createSubmissionCard(submission) {
            const date = new Date(submission.timestamp);
            const formattedDate = date.toLocaleString('cs-CZ');

            const fields = Object.entries(submission.data)
                .map(([key, value]) => {
                    const label = formatLabel(key);
                    const displayValue = formatValue(value);
                    return `
                        <div class="data-field">
                            <label>${label}</label>
                            <value>${displayValue}</value>
                        </div>
                    `;
                })
                .join('');

            return `
                <div class="submission-card">
                    <div class="submission-header">
                        <span class="submission-id">ID: ${submission.id}</span>
                        <span class="submission-time">${formattedDate}</span>
                    </div>
                    <div class="submission-data">
                        ${fields}
                    </div>
                </div>
            `;
        }

        function formatLabel(key) {
            const labels = {
                'service-package': 'Balíček služeb',
                'first-name': 'Jméno',
                'last-name': 'Příjmení',
                'address': 'Adresa',
                'email': 'E-mail',
                'phone': 'Telefon',
                'nationality': 'Státní příslušnost',
                'ico': 'IČO',
                'dic': 'DIČ',
                'tax-office': 'Finanční úřad',
                'health-insurance': 'Zdravotní pojišťovna',
                'social-security-symbol': 'VS ČSSZ',
                'activity-type': 'Typ činnosti',
                'secondary-reason': 'Důvod vedlejší činnosti',
                'taxable-income': 'Zdanitelné příjmy',
                'other-income': 'Jiné příjmy',
                'filing-method': 'Způsob podání',
                'data-box-id': 'ID Datové schránky',
                'tax-deductions': 'Slevy na dani',
                'child-benefits': 'Daňové zvýhodnění na děti',
                'deductible-expenses': 'Nezdanitelné části',
                'pohoda-confirmations': 'POHODA potvrzení',
                'gdpr-consent': 'GDPR souhlas'
            };
            return labels[key] || key;
        }

        function formatValue(value) {
            if (Array.isArray(value)) {
                return `<div class="array-value">${value.map(v => `<span class="array-item">✓ ${v}</span>`).join('')}</div>`;
            }
            if (value === 'on') return '✓ Ano';
            return value || '-';
        }

        function showError(message) {
            const container = document.getElementById('submissions-container');
            container.innerHTML = `<div class="error">${message}</div>`;
        }

        function exportToCSV() {
            fetch(API_URL)
                .then(response => response.json())
                .then(result => {
                    if (!result.success || result.submissions.length === 0) {
                        alert('Žádné data k exportu');
                        return;
                    }

                    const submissions = result.submissions;
                    const headers = ['ID', 'Čas', ...Object.keys(submissions[0].data)];

                    const csvContent = [
                        headers.join(','),
                        ...submissions.map(s => {
                            const row = [
                                s.id,
                                new Date(s.timestamp).toLocaleString('cs-CZ'),
                                ...Object.values(s.data).map(v =>
                                    Array.isArray(v) ? `"${v.join('; ')}"` : `"${v}"`
                                )
                            ];
                            return row.join(',');
                        })
                    ].join('\n');

                    const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
                    const link = document.createElement('a');
                    link.href = URL.createObjectURL(blob);
                    link.download = `odpovedi_${Date.now()}.csv`;
                    link.click();
                })
                .catch(error => {
                    console.error('Export error:', error);
                    alert('Chyba při exportu');
                });
        }

        // Load submissions on page load
        loadSubmissions();

        // Refresh every 10 seconds
        setInterval(loadSubmissions, 10000);
    </script>
</body>

</html>
